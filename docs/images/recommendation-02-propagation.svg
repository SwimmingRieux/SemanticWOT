<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Similarity gates attention on the note graph</title><desc id="desc">The same seed A connects to B and C. A–B has illustrative similarity 0.9; A–C has similarity 0.1. Propagation multiplies one minus restart, the outgoing co-zap strength share, and similarity. A weak path remains weak even if it is the only exit: similarity 0.1 passes 8.5 percent at restart 0.15. Arrows illustrate propagation, not directed graph edges.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#293b40" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<rect width="1100" height="510" rx="18" fill="#fbf9f3"/>
<style>text{font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;fill:#293b40;font-size:20px} .small{font-size:17px;fill:#586a70} .title{font-size:26px;font-weight:700} .label{font-size:22px;font-weight:700} .line{fill:none;stroke:#293b40;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round} .accent{fill:#176f69} .warm{fill:#a85918}</style>
<text x="38" y="46" class="title" text-anchor="start">2 / Let related notes carry more attention</text><text x="38" y="80" class="small" text-anchor="start">Same note graph; embeddings compare the note text.</text><path d="M 229 255 Q 342 192 466 166" fill="none" stroke="#176f69" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 229 280 Q 356 329 465 358" fill="none" stroke="#a85918" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 155 265 C 152 231, 229 221, 232 266 C 235 304, 156 312, 155 265 Z" fill="#e0efea" stroke="#176f69" stroke-width="2.5"/><text x="193" y="274" class="label" text-anchor="middle">A</text><path d="M 469 149 C 466 115, 543 105, 546 150 C 549 188, 470 196, 469 149 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="507" y="158" class="label" text-anchor="middle">B</text><path d="M 469 368 C 466 334, 543 324, 546 369 C 549 407, 470 415, 469 368 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="507" y="377" class="label" text-anchor="middle">C</text><text x="193" y="328" class="small" text-anchor="middle">Solar panels</text><text x="507" y="105" class="small" text-anchor="middle">Solar storage</text><text x="507" y="434" class="small" text-anchor="middle">Garden shade</text><text x="344" y="169" class="accent" text-anchor="middle">similarity 0.9</text><text x="344" y="365" class="warm" text-anchor="middle">similarity 0.1</text><text x="661" y="139" class="label" text-anchor="start">Co-zaps open a path.</text><text x="661" y="172" class="" text-anchor="start">Similarity gates how much crosses it.</text><text x="661" y="228" class="small" text-anchor="start">Pass on attention using:</text><text x="661" y="263" class="accent" text-anchor="start">(1 − restart) × co-zap share</text><text x="661" y="294" class="accent" text-anchor="start">× note similarity</text><path d="M 664 312 Q 844 316 1036 311" fill="none" stroke="#176f69" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="661" y="348" class="small" text-anchor="start">Even a sole similarity-0.1 exit</text><text x="661" y="374" class="small" text-anchor="start">passes only 8.5% at restart = 0.15.</text><text x="39" y="479" class="small" text-anchor="start">Illustrative similarities. Arrows show propagation; the underlying co-zap edges are undirected.</text>
</svg>
