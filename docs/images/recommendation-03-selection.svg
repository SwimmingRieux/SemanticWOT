<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Recency and MMR turn note scores into a feed</title><desc id="desc">An illustrative candidate pool uses the same notes A, B and C. Relevance already includes note recency. A has relevance 1 and is picked first. B has relevance 0.9 and similarity to A of 0.9; C has relevance 0.65 and similarity to A of 0.1. At lambda 0.5 their next MMR values are 0 and 0.275, so C precedes B. This reduces repetition without enforcing a topic or author quota.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#293b40" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<rect width="1100" height="510" rx="18" fill="#fbf9f3"/>
<style>text{font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;fill:#293b40;font-size:20px} .small{font-size:17px;fill:#586a70} .title{font-size:26px;font-weight:700} .label{font-size:22px;font-weight:700} .line{fill:none;stroke:#293b40;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round} .accent{fill:#176f69} .warm{fill:#a85918}</style>
<text x="38" y="46" class="title" text-anchor="start">3 / Favor relevance, then reduce repetition</text><text x="38" y="80" class="small" text-anchor="start">Graph score × note recency gives relevance; MMR chooses the feed order.</text><path d="M 106 153 C 103 123, 172 113, 175 154 C 178 188, 107 196, 106 153 Z" fill="#e0efea" stroke="#176f69" stroke-width="2.5"/><text x="140" y="162" class="label" text-anchor="middle">A</text><path d="M 386 153 C 383 123, 452 113, 455 154 C 458 188, 387 196, 386 153 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="420" y="162" class="label" text-anchor="middle">B</text><path d="M 666 153 C 663 123, 732 113, 735 154 C 738 188, 667 196, 666 153 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="700" y="162" class="label" text-anchor="middle">C</text><text x="140" y="218" class="small" text-anchor="middle">Solar panels</text><text x="420" y="218" class="small" text-anchor="middle">Solar storage</text><text x="700" y="218" class="small" text-anchor="middle">Garden shade</text><path d="M 175 151 Q 277 139 384 153" fill="none" stroke="#176f69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 154 188 Q 415 269 684 188" fill="none" stroke="#a85918" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="39" y="292" class="label" text-anchor="start">Illustrative pool</text><text x="319" y="292" class="small" text-anchor="middle">Relevance</text><text x="503" y="292" class="small" text-anchor="middle">Repetition vs A</text><text x="710" y="292" class="small" text-anchor="middle">Next MMR</text><text x="55" y="338" class="" text-anchor="start">A</text><text x="319" y="338" class="" text-anchor="middle">1.00</text><text x="503" y="338" class="" text-anchor="middle">—</text><text x="710" y="338" class="accent" text-anchor="middle">first pick</text><text x="55" y="382" class="" text-anchor="start">B</text><text x="319" y="382" class="" text-anchor="middle">0.90</text><text x="503" y="382" class="" text-anchor="middle">0.90</text><text x="710" y="382" class="" text-anchor="middle">0.00</text><text x="55" y="426" class="" text-anchor="start">C</text><text x="319" y="426" class="" text-anchor="middle">0.65</text><text x="503" y="426" class="" text-anchor="middle">0.10</text><text x="710" y="426" class="accent" text-anchor="middle">0.275</text><path d="M 816 109 Q 812 278 816 450" fill="none" stroke="#586a70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 8"/><text x="861" y="150" class="label" text-anchor="start">Feed order</text><path d="M 864 220 C 861 196, 918 186, 921 221 C 924 249, 865 257, 864 220 Z" fill="#e0efea" stroke="#176f69" stroke-width="2.5"/><text x="892" y="229" class="label" text-anchor="middle">A</text><text x="943" y="229" class="" text-anchor="start">1st</text><path d="M 864 316 C 861 292, 918 282, 921 317 C 924 345, 865 353, 864 316 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="892" y="325" class="label" text-anchor="middle">C</text><text x="943" y="325" class="" text-anchor="start">2nd</text><text x="861" y="379" class="small" text-anchor="start">B can follow.</text><text x="861" y="410" class="small" text-anchor="start">Less repetition,</text><text x="861" y="435" class="small" text-anchor="start">not a topic quota.</text><text x="39" y="479" class="small" text-anchor="start">Example at λ = 0.5: next MMR = 0.5 × relevance − 0.5 × repetition. Scores are illustrative.</text>
</svg>
