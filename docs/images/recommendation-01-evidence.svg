<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="title desc">
<title id="title">Viewer-sent zaps become a graph of notes</title><desc id="desc">You sent a zap to note A, about solar panels. Robin zapped A and B, about solar storage; Sam zapped A and C, about garden shade. People appear in rectangular evidence boxes. The derived graph contains only note circles A, B and C, with undirected edges A–B and A–C.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#293b40" stroke-width="1.5" stroke-linejoin="round"/></marker></defs>
<rect width="1100" height="510" rx="18" fill="#fbf9f3"/>
<style>text{font-family:ui-rounded,"Trebuchet MS",Arial,sans-serif;fill:#293b40;font-size:20px} .small{font-size:17px;fill:#586a70} .title{font-size:26px;font-weight:700} .label{font-size:22px;font-weight:700} .line{fill:none;stroke:#293b40;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round} .accent{fill:#176f69} .warm{fill:#a85918}</style>
<text x="38" y="46" class="title" text-anchor="start">1 / Start with zaps you sent</text><text x="38" y="80" class="small" text-anchor="start">People supply evidence; circles are notes.</text><path d="M 49 127 L 168 125 L 171 169 L 51 171 Z" fill="none" stroke="#586a70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="155" class="" text-anchor="middle">You</text><path d="M 49 235 L 168 233 L 171 277 L 51 279 Z" fill="none" stroke="#586a70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="263" class="" text-anchor="middle">Robin</text><path d="M 49 350 L 168 348 L 171 392 L 51 394 Z" fill="none" stroke="#586a70" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="378" class="" text-anchor="middle">Sam</text><path d="M 175 147 Q 257 143 348 148" fill="none" stroke="#176f69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="223" y="130" class="small" text-anchor="middle">sent zap</text><path d="M 175 247 Q 250 201 348 156" fill="none" stroke="#293b40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 175 259 Q 255 255 348 261" fill="none" stroke="#293b40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 175 361 Q 264 274 355 172" fill="none" stroke="#293b40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 175 375 Q 260 374 348 375" fill="none" stroke="#293b40" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 353 146 C 350 116, 419 106, 422 147 C 425 181, 354 189, 353 146 Z" fill="#e0efea" stroke="#176f69" stroke-width="2.5"/><text x="387" y="155" class="label" text-anchor="middle">A</text><path d="M 353 260 C 350 230, 419 220, 422 261 C 425 295, 354 303, 353 260 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="387" y="269" class="label" text-anchor="middle">B</text><path d="M 353 373 C 350 343, 419 333, 422 374 C 425 408, 354 416, 353 373 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="387" y="382" class="label" text-anchor="middle">C</text><text x="438" y="152" class="" text-anchor="start">Solar panels</text><text x="438" y="266" class="" text-anchor="start">Solar storage</text><text x="438" y="379" class="" text-anchor="start">Garden shade</text><text x="39" y="439" class="small" text-anchor="start">Robin zapped A + B; Sam zapped A + C.</text><text x="39" y="466" class="small" text-anchor="start">Their shared zaps connect the notes.</text><path d="M 654 104 Q 651 278 655 464" fill="none" stroke="#586a70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 8"/><text x="705" y="114" class="label" text-anchor="start">The ranking graph</text><path d="M 818 240 Q 867 209 909 196" fill="none" stroke="#293b40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 819 266 Q 874 308 908 334" fill="none" stroke="#293b40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 750 251 C 747 221, 816 211, 819 252 C 822 286, 751 294, 750 251 Z" fill="#e0efea" stroke="#176f69" stroke-width="2.5"/><text x="784" y="260" class="label" text-anchor="middle">A</text><path d="M 913 181 C 910 151, 979 141, 982 182 C 985 216, 914 224, 913 181 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="947" y="190" class="label" text-anchor="middle">B</text><path d="M 913 351 C 910 321, 979 311, 982 352 C 985 386, 914 394, 913 351 Z" fill="#fbf9f3" stroke="#293b40" stroke-width="2.5"/><text x="947" y="360" class="label" text-anchor="middle">C</text><text x="836" y="196" class="small" text-anchor="middle">Robin</text><text x="853" y="322" class="small" text-anchor="middle">Sam</text><text x="706" y="428" class="accent" text-anchor="start">A is the seed.</text><text x="706" y="457" class="small" text-anchor="start">People are not ranking nodes.</text>
</svg>
